services:
  postgres:
    image: postgres:16
    container_name: one-lister-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: onelister
      POSTGRES_PASSWORD: onelister
      POSTGRES_DB: onelister
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onelister -d onelister"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: one-lister-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible local store. Official minio/minio is currently unavailable
  # on Docker Hub from this environment; adobe/s3mock provides the same API
  # surface (presigned PUT/GET/HEAD/DELETE) and creates the bucket on startup.
  minio:
    image: adobe/s3mock:latest
    container_name: one-lister-minio
    restart: unless-stopped
    ports:
      - "9000:9090"
    environment:
      initialBuckets: one-lister
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - minio_data:/tmp/s3mock

volumes:
  postgres_data:
  redis_data:
  minio_data:
